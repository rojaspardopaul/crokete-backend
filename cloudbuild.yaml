steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-south1-docker.pkg.dev/$PROJECT_ID/backend-repo/backend-image:latest', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-south1-docker.pkg.dev/$PROJECT_ID/backend-repo/backend-image:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy backend-service \
          --image us-south1-docker.pkg.dev/$PROJECT_ID/backend-repo/backend-image:latest \
          --region $_REGION \
          --platform managed \
          --allow-unauthenticated \
          --set-secrets=MONGO_URI=mongo-uri-secret:latest,JWT_SECRET=jwt-secret:latest,JWT_SECRET_FOR_VERIFY=jwt-secret-for-verify:latest,JWT_REFRESH_SECRET=jwt-refresh-secret:latest,ENCRYPT_PASSWORD=encrypt-password-secret:latest,STRIPE_KEY=stripe-key-secret:latest,STRIPE_SECRET=stripe-secret-secret:latest,CLOUDINARY_URL=cloudinary-url-secret:latest,PAYPAL_CLIENT_ID=paypal-client-id-secret:latest,PAYPAL_APP_SECRET=paypal-app-secret-secret:latest,EMAIL_USER=email-user-secret:4,EMAIL_PASS=email-pass-secret:4,EMAIL_HOST=email-host-secret:4,EMAIL_PORT=email-port-secret:3,TWILIO_ACCOUNT_SID=twilio-sid-secret:latest,TWILIO_AUTH_TOKEN=twilio-token-secret:latest,GOOGLE_CLIENT_ID=google-client-id-secret:latest,GOOGLE_CLIENT_SECRET=google-client-secret-secret:latest,NEXTAUTH_SECRET=nextauth-secret:latest,STORE_URL=store-url-secret:latest,ADMIN_URL=admin-url-secret:latest

images:
  - 'us-south1-docker.pkg.dev/$PROJECT_ID/backend-repo/backend-image:latest'

substitutions:
  _REGION: 'us-south1'

timeout: 1200s