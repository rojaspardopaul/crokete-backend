steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-south1-docker.pkg.dev/$PROJECT_ID/backend-repo/backend-image:${_TAG}'
      - '-t'
      - 'us-south1-docker.pkg.dev/$PROJECT_ID/backend-repo/backend-image:latest'
      - '.'

  # Push image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'us-south1-docker.pkg.dev/$PROJECT_ID/backend-repo/backend-image']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy backend-service \
          --image us-south1-docker.pkg.dev/$PROJECT_ID/backend-repo/backend-image:${_TAG} \
          --region $_REGION \
          --platform managed \
          --allow-unauthenticated \
          --min-instances=0 \
          --max-instances=5 \
          --memory=512Mi \
          --cpu=1 \
          --set-env-vars=NODE_ENV=production,SERVICE=zoho,JWT_ACCESS_LIFETIME=60m,JWT_REFRESH_LIFETIME=7d,USE_TS_CATALOG=true,USE_TS_ORDERS=true,USE_TS_CUSTOMERS=true \
          --set-secrets=MONGO_URI=mongo-uri-secret:latest,JWT_SECRET=jwt-secret:latest,JWT_SECRET_FOR_VERIFY=jwt-secret-for-verify:latest,JWT_REFRESH_SECRET=jwt-refresh-secret:latest,ENCRYPT_PASSWORD=encrypt-password-secret:latest,STRIPE_KEY=stripe-key-secret:latest,STRIPE_SECRET=stripe-secret-secret:latest,STRIPE_WEBHOOK_SECRET=stripe-webhook-secret:latest,CLOUDINARY_URL=cloudinary-url-secret:latest,PAYPAL_CLIENT_ID=paypal-client-id-secret:latest,PAYPAL_APP_SECRET=paypal-app-secret-secret:latest,EMAIL_USER=email-user-secret:latest,EMAIL_PASS=email-pass-secret:latest,EMAIL_HOST=email-host-secret:latest,EMAIL_PORT=email-port-secret:latest,TWILIO_ACCOUNT_SID=twilio-sid-secret:latest,TWILIO_AUTH_TOKEN=twilio-token-secret:latest,GOOGLE_CLIENT_ID=google-client-id-secret:latest,GOOGLE_CLIENT_SECRET=google-client-secret-secret:latest,NEXTAUTH_SECRET=nextauth-secret:latest,STORE_URL=store-url-secret:latest,ADMIN_URL=admin-url-secret:latest,GEMINI_API_KEY=gemini-api-key-secret:latest,OPENAI_API_KEY=openai-api-key-secret:latest

images:
  - 'us-south1-docker.pkg.dev/$PROJECT_ID/backend-repo/backend-image:${_TAG}'
  - 'us-south1-docker.pkg.dev/$PROJECT_ID/backend-repo/backend-image:latest'

# _TAG defaults to 'latest' so manual `gcloud builds submit` works without args.
# A Cloud Build trigger can override it for immutable tags, e.g.
#   --substitutions=_TAG=$COMMIT_SHA
substitutions:
  _REGION: 'us-south1'
  _TAG: 'latest'

timeout: 1200s